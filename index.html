const W=900,H=975,TOTAL=60000;
const canvas=document.querySelector('#art'),ctx=canvas.getContext('2d');
const make=()=>{let c=document.createElement('canvas');c.width=W;c.height=H;return c};
const lines=make(),mask=make(),layer=make(),paper=make();
const lc=lines.getContext('2d'),mc=mask.getContext('2d'),cc=layer.getContext('2d'),pc=paper.getContext('2d');
const stage=document.querySelector('#stage'),time=document.querySelector('#time'),slider=document.querySelector('#timeline');
let seed=109;function random(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
pc.fillStyle='#270d10';pc.fillRect(0,0,W,H);for(let i=0;i<42000;i++){pc.fillStyle=`rgba(208,166,107,${random()*.04})`;pc.fillRect(random()*W,random()*H,random()*1.8,.7)}
const graphite=new Image(),color=new Image();
const paths=DATA.paths;
let marks=[];
function region(x,y){return Math.abs(x-450)<40+y*.43?0:1}
// Short diagonal pencil strokes overlap into an opaque mask; no full-frame fade.
for(let pass=0;pass<3;pass++){
 let set=[];
 for(let y=-10;y<H+18;y+=8){for(let x=-16;x<W+22;x+=13){let xx=x+(pass%2)*6+(random()-.5)*3,yy=y+(pass%2)*4;
 set.push({x:xx,y:yy,pass,order:region(xx,yy)*10000+Math.floor(yy/40)*300+xx*.16+random()*20});}}
 set.sort((a,b)=>a.order-b.order);marks.push(...set);
}
let drawnLines=0,drawnMarks=0,elapsed=0,last=0,paused=false,raf=0,ready=false;
function resetLayers(){lc.clearRect(0,0,W,H);mc.clearRect(0,0,W,H);drawnLines=0;drawnMarks=0}
function drawContour(path){lc.beginPath();lc.moveTo(...path[0]);for(let i=1;i<path.length;i++)lc.lineTo(...path[i]);lc.strokeStyle='#d1bca0';lc.globalAlpha=.54;lc.lineWidth=.8;lc.lineCap='round';lc.stroke();lc.globalAlpha=1}
function pencil(x,y,col){ctx.save();ctx.translate(x,y);ctx.rotate(.55);ctx.shadowColor='#5a483a33';ctx.shadowBlur=3;ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(3,-15);ctx.lineTo(3,-65);ctx.lineTo(8,-65);ctx.lineTo(8,-15);ctx.closePath();ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#d5b78b';ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(3,-15);ctx.lineTo(8,-15);ctx.closePath();ctx.fill();ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,0);ctx.lineTo(1.5,-5);ctx.lineTo(3.5,-4);ctx.closePath();ctx.fill();ctx.restore()}
function render(ms){
 const lineCount=Math.min(paths.length,Math.floor(ms/22000*paths.length));
 const markCount=Math.min(marks.length,Math.floor(Math.max(0,(ms-22000)/38000)*marks.length));
 if(lineCount<drawnLines||markCount<drawnMarks)resetLayers();
 while(drawnLines<lineCount)drawContour(paths[drawnLines++]);
 while(drawnMarks<markCount){const s=marks[drawnMarks++];mc.strokeStyle=s.pass===0?'rgba(0,0,0,.68)':'#000';mc.lineWidth=s.pass===0?6:12;mc.lineCap='round';mc.beginPath();mc.moveTo(s.x-6,s.y+9);mc.lineTo(s.x+12,s.y-9);mc.stroke();}
 ctx.clearRect(0,0,W,H);ctx.drawImage(paper,0,0);ctx.drawImage(lines,0,0);
 if(markCount){cc.clearRect(0,0,W,H);cc.globalCompositeOperation='source-over';cc.drawImage(color,0,0);cc.globalCompositeOperation='destination-in';cc.drawImage(mask,0,0);cc.globalCompositeOperation='source-over';ctx.drawImage(layer,0,0)}
 if(ms<TOTAL&&!paused){if(ms<22000&&lineCount){const p=paths[lineCount-1];pencil(...p[p.length-1],'#655a4e')}else if(markCount){const s=marks[markCount-1];pencil(s.x+12,s.y-9,s.pass===0?'#767b49':s.pass===1?'#ab7141':'#ba9b55')}}
 const phase=ms<22000?'勾勒 · 星星与枝叶':ms<34667?'铺色 · 松绿与暖金':ms<47333?'叠色 · 蝴蝶结与彩球':ms<TOTAL?'细绘 · 补充色彩与纹理':'完成 · 祝福留在纸上';
 if(stage.textContent!==phase)stage.textContent=phase;
 const seconds=Math.floor(ms/1000);time.textContent=`${seconds===60?'01':'00'}:${String(seconds%60).padStart(2,'0')} / 01:00`;slider.value=ms;
}
function frame(now){if(!ready)return;if(!last)last=now;if(!paused)elapsed=Math.min(TOTAL,elapsed+now-last);last=now;render(elapsed);if(elapsed<TOTAL&&!paused)raf=requestAnimationFrame(frame);else if(elapsed===TOTAL){paused=true;document.querySelector('#pause').textContent='播放'}}
function start(){cancelAnimationFrame(raf);last=0;raf=requestAnimationFrame(frame)}
document.querySelector('#replay').onclick=()=>{if(!ready)return;elapsed=0;paused=false;resetLayers();document.querySelector('#pause').textContent='暂停';start()};
document.querySelector('#pause').onclick=()=>{if(!ready)return;if(elapsed>=TOTAL){elapsed=0;resetLayers()}paused=!paused;document.querySelector('#pause').textContent=paused?'播放':'暂停';start()};
document.querySelector('#finish').onclick=()=>{if(!ready)return;paused=true;elapsed=TOTAL;document.querySelector('#pause').textContent='播放';cancelAnimationFrame(raf);render(elapsed)};
slider.oninput=()=>{if(!ready)return;elapsed=+slider.value;paused=true;document.querySelector('#pause').textContent='播放';cancelAnimationFrame(raf);render(elapsed)};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused){paused=true;document.querySelector('#pause').textContent='播放';cancelAnimationFrame(raf);render(elapsed)}});
color.onload=()=>{ready=true;render(0);start()};color.onerror=()=>{const e=document.querySelector('#error');e.hidden=false;e.textContent='画稿加载失败，请重新打开网页。'};
color.src='data:image/jpeg;base64,'+DATA.color;

const choices=document.querySelector('.choices');
const noButton=document.querySelector('#no');
const yesButton=document.querySelector('#yes');
let refusalCount=0;
noButton.addEventListener('click',()=>{
 refusalCount=Math.min(3,refusalCount+1);
 choices.dataset.step=String(refusalCount);
 if(refusalCount===3){noButton.hidden=true;yesButton.focus({preventScroll:true});}
});
yesButton.addEventListener('click',()=>{
 choices.hidden=true;
 const answer=document.querySelector('#answer');
 answer.textContent='那就说好啦，期待和师姐一起过圣诞 ♡';
 answer.hidden=false;
});
</script></body></html>
